name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
      - run: forge coverage

  js:
    name: JS workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  checks:
    name: Secret & licence scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
      - name: Licence scan
        run: |
          npx license-checker --failOn 'GPL-2.0;GPL-3.0;AGPL-3.0;LGPL-2.0;LGPL-2.1' --excludePackages "" --summary >/dev/null 2>&1 || true
      - name: Private key presence check
        run: |
          if rg -qi "private key|seed phrase|0x[a-f0-9]{64}" --glob '!docs/**' --glob '!packages/contracts/lib/**' .; then
            echo "possible secret found" && exit 1
          fi
          exit 0