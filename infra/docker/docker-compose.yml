services:
  postgres:
    image: postgres:16-alpine
    container_name: penny-indexer-db
    environment:
      POSTGRES_USER: penny
      POSTGRES_PASSWORD: penny
      POSTGRES_DB: penny_indexer
    ports:
      - "5432:5432"
    volumes:
      - penny_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penny"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  penny_pgdata: